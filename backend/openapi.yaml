openapi: 3.1.0
info:
  title: КРОК Insight
  version: 0.7.0
  description: API карты ЛПР, истории касаний и охвата участников на синтетических данных.
servers:
  - url: http://127.0.0.1:8080
security:
  - demoBasic: []
paths:
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      summary: Сводка видимых компаний и рисков
      parameters:
        - $ref: '#/components/parameters/KitDays'
      responses:
        '200':
          description: Сводка видимых компаний и рисков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              examples:
                demo:
                  externalValue: ./examples/dashboard.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Режим API и наличие права записывать взаимодействия
      responses:
        '200':
          description: Режим API и наличие права записывать взаимодействия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                demo:
                  externalValue: ./examples/capabilities-reader.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies/{companyId}:
    get:
      operationId: getCompany
      summary: Карточка корпоративного клиента
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Карточка корпоративного клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
              examples:
                demo:
                  externalValue: ./examples/company-profile.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/contacts:
    get:
      operationId: listCompanyContacts
      summary: Страница контактов компании с фильтрами
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ContactSearch'
        - $ref: '#/components/parameters/ContactDepartment'
        - $ref: '#/components/parameters/ContactJobTitle'
        - $ref: '#/components/parameters/ContactRole'
        - $ref: '#/components/parameters/ContactInfluence'
        - $ref: '#/components/parameters/ContactDecisionMaker'
        - $ref: '#/components/parameters/ContactInteraction'
        - $ref: '#/components/parameters/ContactManager'
        - $ref: '#/components/parameters/KitDays'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Страница контактов компании с фильтрами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContactPage'
              examples:
                demo:
                  externalValue: ./examples/company-contacts.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/contacts/{contactId}:
    get:
      operationId: getCompanyContact
      summary: Профиль сотрудника, роли в инициативах и связанные контакты
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/CompanyContactId'
      responses:
        '200':
          description: Профиль сотрудника, роли в инициативах и связанные контакты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContactProfile'
              examples:
                demo:
                  externalValue: ./examples/company-contact.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/graph:
    get:
      operationId: getCompanyGraph
      summary: Граф компании со связями по инициативам
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ContactSearch'
        - $ref: '#/components/parameters/ContactDepartment'
        - $ref: '#/components/parameters/ContactJobTitle'
        - $ref: '#/components/parameters/ContactRole'
        - $ref: '#/components/parameters/ContactInfluence'
        - $ref: '#/components/parameters/ContactDecisionMaker'
        - $ref: '#/components/parameters/ContactInteraction'
        - $ref: '#/components/parameters/ContactManager'
        - $ref: '#/components/parameters/KitDays'
      responses:
        '200':
          description: Граф компании со связями по инициативам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGraph'
              examples:
                demo:
                  externalValue: ./examples/company-graph.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/events:
    get:
      operationId: listCompanyEvents
      summary: Хронология компании или контакта с курсорной пагинацией
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: personId
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          schema: {type: string, format: uuid}
        - name: through
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/ContactManager'
        - $ref: '#/components/parameters/ContactSearch'
        - {name: type, in: query, schema: {type: string, enum: [MEETING, CALL, EMAIL, NOTE, PROPOSAL]}}
        - {name: initiativeId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Хронология компании или контакта с курсорной пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchpointPage'
              examples:
                demo:
                  externalValue: ./examples/company-events.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/insights:
    get:
      operationId: getCompanyInsights
      summary: Серверные факты о рисках по инициативам компании
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/KitDays'
      responses:
        '200':
          description: Серверные факты о рисках по инициативам компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInsights'
              examples:
                demo:
                  externalValue: ./examples/company-insights.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies:
    get:
      operationId: listCompanies
      summary: Доступные компании
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
              examples:
                demo:
                  externalValue: ./examples/companies.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/contacts/search:
    get:
      operationId: searchWorkspaceContacts
      summary: Поиск сотрудников в доступных компаниях
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
      responses:
        '200':
          description: До пяти подходящих контактов без контактных данных
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [id, name, jobTitle, companyId, companyName]
                  properties:
                    id: {type: string, format: uuid}
                    name: {type: string}
                    jobTitle: {type: [string, 'null']}
                    companyId: {type: string, format: uuid}
                    companyName: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/companies/{companyId}/initiatives:
    get:
      operationId: listInitiatives
      summary: Инициативы выбранной компании
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список инициатив
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Initiative'
              examples:
                northernLine:
                  externalValue: ./examples/initiatives.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createProject
      summary: Создать проект клиента
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectChange'}
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedWorkspaceItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Требуются права редактора и CSRF}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Запись изменилась или уже существует}
  /api/v1/initiatives/{initiativeId}/graph:
    get:
      operationId: getInitiativeGraph
      summary: Люди и направленные связи в инициативе
      parameters:
        - name: initiativeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: roleCode
          in: query
          description: Код роли из filters.roles. Условия по роли и отделу применяются одновременно.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{0,31}$'
          example: BUDGET_APPROVER
        - name: departmentId
          in: query
          description: Идентификатор отдела из filters.departments.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Граф, включая пустую выборку при отсутствии совпадений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              examples:
                unfiltered:
                  externalValue: ./examples/graph.json
                budgetApprover:
                  externalValue: ./examples/graph-budget-approver.json
                noMatches:
                  externalValue: ./examples/graph-empty.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/people/{personId}:
    get:
      operationId: getPersonDossier
      summary: Карточка участника в контексте инициативы
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные участника и дата среза
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDossier'
              examples:
                marina:
                  externalValue: ./examples/person.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateParticipant
      summary: Изменить данные участника
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/CsrfHeader'
        - {name: personId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantChange'}
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedWorkspaceItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Требуются права редактора и CSRF}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Запись изменилась или уже существует}
  /api/v1/initiatives/{initiativeId}/events:
    get:
      operationId: listTouchpoints
      summary: История касаний инициативы или участника
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: personId
          in: query
          description: ID участника этой инициативы. Без параметра возвращается история всей инициативы.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: ID последнего события предыдущей страницы. При смене фильтра начните с первой страницы. Если события нет в текущей выборке, сервер возвращает 400.
          schema:
            type: string
            format: uuid
        - name: through
          in: query
          description: Включительная граница по дате события. Используйте дату среза, чтобы история совпадала с охватом.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Страница событий от новых к старым. При одинаковой дате порядок определяется ID по убыванию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchpointPage'
              examples:
                marina:
                  externalValue: ./examples/events-person.json
                firstPage:
                  externalValue: ./examples/events-first-page.json
                noEvents:
                  externalValue: ./examples/events-empty.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTouchpoint
      summary: Зафиксировать взаимодействие и его участников
      description: Повтор с тем же ID и данными возвращает тот же результат. Изменённый запрос с тем же ID даёт 409.
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TouchpointChange'}
      responses:
        '201':
          description: Взаимодействие записано
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Требуются права редактора и CSRF-токен
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: ID уже использован для другой записи
        '503':
          description: Запись взаимодействий недоступна
  /api/v1/initiatives/{initiativeId}/interaction-managers:
    get:
      operationId: listInteractionManagers
      summary: Ответственные и контакты, с которыми они взаимодействовали в проекте
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
      responses:
        '200':
          description: Список менеджеров и уникальные ID участников в истории
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, contactIds]
                  properties:
                    name: {type: string}
                    contactIds: {type: array, items: {type: string, format: uuid}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/initiatives/{initiativeId}/coverage:
    get:
      operationId: getInitiativeCoverage
      summary: Давность касаний и проверок контактных данных
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: days
          in: query
          description: Порог давности касаний в сутках от даты среза.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Сведения об охвате по участникам и подразделениям
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                northernLine:
                  externalValue: ./examples/coverage.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/relationship-health:
    get:
      operationId: getRelationshipHealth
      summary: Индекс устойчивости отношений по срезу инициативы
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
      responses:
        '200':
          description: Оценка, полнота данных и вклад каждого показателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipHealth'
              examples:
                northernLine:
                  externalValue: ./examples/relationship-health.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/people/{personId}/demo-source:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
      - name: personId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getDemoSource
      summary: Текущая версия позиции и разрешение на правку
      responses:
        '200':
          description: Данные тестового источника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSource'
              examples:
                marina:
                  externalValue: ./examples/position-source.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDemoSource
      summary: Сохранить новую версию позиции
      description: Требуются учётная запись деморедактора и cookie вместе с CSRF-заголовком из GET /api/v1/csrf.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, stance, basis]
              properties:
                expectedVersion: {type: integer, minimum: 0, maximum: 2147483646}
                stance:
                  $ref: '#/components/schemas/Stance'
                basis: {type: string, minLength: 1, maxLength: 1200}
      responses:
        '200':
          description: Сохранённая версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Отсутствует право на изменение или CSRF-токен
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ожидаемая версия устарела. Перечитайте источник перед повторной правкой.
        '503':
          description: База тестового источника недоступна
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      summary: Получить CSRF-токен и cookie для изменения данных
      responses:
        '200':
          description: Токен для заголовка запроса
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string}
                  token: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ai/settings:
    get:
      operationId: getLocalModelSettings
      summary: Настройки модели текущего пользователя
      responses:
        '200':
          description: Наличие серверных настроек и имя модели
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSettings'}
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: configureModel
      summary: Проверить и подключить модель пользователя
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelSelection'}
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Требуются права редактора и CSRF}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Запись изменилась или уже существует}
    delete:
      operationId: resetModel
      summary: Сбросить настройку модели пользователя
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Требуются права редактора и CSRF}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Запись изменилась или уже существует}
  /api/v1/initiatives/{initiativeId}/ai/advice:
    post:
      operationId: requestLocalAdvice
      summary: Запросить совет у локальной модели по доступной инициативе
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
