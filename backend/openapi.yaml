openapi: 3.1.0
info:
  title: КРОК Insight
  version: 0.5.0
  description: API карты ЛПР, истории касаний и охвата участников на синтетических данных.
servers:
  - url: http://127.0.0.1:8080
security:
  - demoBasic: []
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Режим источника и разрешение добавлять взаимодействия
      responses:
        '200':
          description: Доступные действия текущего пользователя
          content:
            application/json:
              schema:
                type: object
                required: [mode, canCreateEvents]
                properties:
                  mode: {type: string, enum: [api, demo]}
                  canCreateEvents: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies:
    get:
      operationId: listCompanies
      summary: Доступные компании
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
              examples:
                demo:
                  externalValue: ./examples/companies.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies/{companyId}/initiatives:
    get:
      operationId: listInitiatives
      summary: Инициативы выбранной компании
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список инициатив
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Initiative'
              examples:
                northernLine:
                  externalValue: ./examples/initiatives.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/graph:
    get:
      operationId: getInitiativeGraph
      summary: Люди и направленные связи в инициативе
      parameters:
        - name: initiativeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: roleCode
          in: query
          description: Код роли из filters.roles. Условия по роли и отделу применяются одновременно.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{0,31}$'
          example: BUDGET_APPROVER
        - name: departmentId
          in: query
          description: Идентификатор отдела из filters.departments.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Граф, включая пустую выборку при отсутствии совпадений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              examples:
                unfiltered:
                  externalValue: ./examples/graph.json
                budgetApprover:
                  externalValue: ./examples/graph-budget-approver.json
                noMatches:
                  externalValue: ./examples/graph-empty.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/people/{personId}:
    get:
      operationId: getPersonDossier
      summary: Карточка участника в контексте инициативы
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные участника и дата среза
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDossier'
              examples:
                marina:
                  externalValue: ./examples/person.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/events:
    post:
      operationId: createTouchpoint
      summary: Зафиксировать взаимодействие и обновить срез инициативы
      description: Нужны DEMO_EDITOR, cookie и CSRF-заголовок. Участники должны относиться к инициативе. Один ID с тем же содержимым идемпотентен; другое содержимое с тем же ID возвращает 409. Автор определяется сервером.
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchpointChange'
      responses:
        '201':
          description: Событие сохранено; запись и участники добавлены атомарно
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав или неверный CSRF-токен
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ID события уже использован для другого запроса
    get:
      operationId: listTouchpoints
      summary: История касаний инициативы или участника
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: personId
          in: query
          description: ID участника этой инициативы. Без параметра возвращается история всей инициативы.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: ID последнего события предыдущей страницы. При смене фильтра начните с первой страницы. Если события нет в текущей выборке, сервер возвращает 400.
          schema:
            type: string
            format: uuid
        - name: through
          in: query
          description: Включительная граница по дате события. Используйте дату среза, чтобы история совпадала с охватом.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Страница событий от новых к старым. При одинаковой дате порядок определяется ID по убыванию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchpointPage'
              examples:
                marina:
                  externalValue: ./examples/events-person.json
                firstPage:
                  externalValue: ./examples/events-first-page.json
                noEvents:
                  externalValue: ./examples/events-empty.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/coverage:
    get:
      operationId: getInitiativeCoverage
      summary: Давность касаний и проверок контактных данных
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - name: days
          in: query
          description: Порог давности касаний в сутках от даты среза.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Сведения об охвате по участникам и подразделениям
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                northernLine:
                  externalValue: ./examples/coverage.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/initiatives/{initiativeId}/people/{personId}/demo-source:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
      - name: personId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getDemoSource
      summary: Текущая версия позиции и разрешение на правку
      responses:
        '200':
          description: Данные тестового источника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSource'
              examples:
                marina:
                  externalValue: ./examples/position-source.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDemoSource
      summary: Сохранить новую версию позиции
      description: Требуются учётная запись деморедактора и cookie вместе с CSRF-заголовком из GET /api/v1/csrf.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, stance, basis]
              properties:
                expectedVersion: {type: integer, minimum: 0, maximum: 2147483646}
                stance:
                  $ref: '#/components/schemas/Stance'
                basis: {type: string, minLength: 1, maxLength: 1200}
      responses:
        '200':
          description: Сохранённая версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Отсутствует право на изменение или CSRF-токен
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ожидаемая версия устарела. Перечитайте источник перед повторной правкой.
        '503':
          description: База тестового источника недоступна
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      summary: Получить CSRF-токен и cookie для изменения данных
      responses:
        '200':
          description: Токен для заголовка запроса
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string}
                  token: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ai/settings:
    get:
      operationId: getLocalModelSettings
      summary: Настройки локальной модели
      responses:
        '200':
          description: Наличие серверных настроек и имя модели
          content:
            application/json:
              schema:
                type: object
                required: [enabled, model]
                properties:
                  enabled: {type: boolean}
                  model: {type: [string, 'null']}
              examples:
                disabled:
                  externalValue: ./examples/local-model-disabled.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/initiatives/{initiativeId}/ai/advice:
    post:
      operationId: requestLocalAdvice
      summary: Запросить совет у локальной модели по доступной инициативе
      parameters:
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, question]
              properties:
                days: {type: integer, minimum: 1, maximum: 365}
                question: {type: string, minLength: 1, maxLength: 400}
      responses:
        '200':
          description: Текстовая подсказка
          content:
            application/json:
              schema:
                type: object
                required: [model, answer, asOf]
                properties:
                  model: {type: string}
                  answer: {type: string}
                  asOf: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Отсутствует действительный CSRF-токен
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Модель занята
        '502':
          description: Локальная модель не ответила корректно
        '503':
          description: Локальная модель не настроена
        '504':
          description: Локальная модель превысила время ожидания
components:
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    demoBasic:
      type: http
      scheme: basic
      description: Локальный профиль demo. Для чтения используется demo-reader. Для изменения позиции требуется demo-editor.
  responses:
    BadRequest:
      description: Неверный идентификатор, параметр или тело запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуются действительные учётные данные демопрофиля
    NotFound:
      description: Запись отсутствует или текущему пользователю недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        industry: {type: [string, 'null']}
        description: {type: [string, 'null']}
    Initiative:
      type: object
      required: [id, companyId, name, asOf]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
        asOf:
          type: string
          format: date-time
    Graph:
      type: object
      required: [companyId, initiativeId, asOf, nodes, edges, filters, matchingPeople]
      properties:
        companyId:
          type: string
          format: uuid
        initiativeId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
          description: Дата среза данных инициативы.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          description: Направленные связи, оба участника которых входят в видимую выборку.
          items:
            $ref: '#/components/schemas/Edge'
        filters:
          $ref: '#/components/schemas/Filters'
        matchingPeople:
          type: integer
          minimum: 0
          description: Число участников после применения фильтров.
    Node:
      type: object
      required: [id, name, jobTitle, department, role, decisionMaker]
      properties:
        id:
          type: string
          format: uuid
          description: ID контакта сохраняется при смене инициативы.
        name:
          type: string
        jobTitle:
          type: [string, 'null']
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
        role:
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        decisionMaker:
          type: boolean
          description: Признак ЛПР в текущей инициативе. ЛПР может быть несколько.
        influence: {type: [string, 'null'], enum: [HIGH, MEDIUM, LOW, null]}
        influenceBasis: {type: [string, 'null']}
        email: {type: [string, 'null']}
        phone: {type: [string, 'null']}
    Edge:
      type: object
      required: [id, source, target, type, label, confirmed]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        type:
          type: string
          description: Код типа связи. В демонаборе используются APPROVAL, EXPERTISE и COORDINATION.
        label:
          type: string
        confirmed:
          type: boolean
    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Role:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,31}$'
        label:
          type: string
    Filters:
      type: object
      description: Варианты фильтров для всей доступной инициативы.
      required: [departments, roles]
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PersonDossier:
      type: object
      required: [companyId, initiativeId, asOf, person, position]
      properties:
        companyId:
          type: string
          format: uuid
        initiativeId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        person:
          $ref: '#/components/schemas/Node'
        position:
          oneOf:
            - $ref: '#/components/schemas/PositionRevision'
            - type: 'null'
    Stance:
      type: string
      enum: [SUPPORTS, NEUTRAL, DOUBTS, OPPOSES]
    PositionRevision:
      type: object
      required: [version, stance, basis, author, changedAt]
      properties:
        version: {type: integer, minimum: 1}
        stance:
          $ref: '#/components/schemas/Stance'
        basis: {type: string}
        author: {type: string}
        changedAt: {type: string, format: date-time}
    PositionSource:
      type: object
      required: [version, position, canEdit]
      properties:
        version:
          type: integer
          minimum: 0
          description: Ноль означает, что в источнике пока нет позиции.
        position:
          oneOf:
            - $ref: '#/components/schemas/PositionRevision'
            - type: 'null'
        canEdit: {type: boolean}
    TouchpointPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Touchpoint'
        nextCursor:
          type: [string, 'null']
          format: uuid
          description: Значение для следующего запроса или null в конце истории.
    Touchpoint:
      type: object
      required: [id, type, occurredAt, team, subject, outcome, nextStep, sourceLabel, participants]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Код вида касания. В демонаборе используются MEETING, EMAIL и CALL.
        occurredAt:
          type: string
          format: date-time
        team:
          type: string
        subject:
          type: string
        outcome:
          type: [string, 'null']
        nextStep:
          type: [string, 'null']
        sourceLabel:
          type: [string, 'null']
        participants:
          type: array
          items:
            $ref: '#/components/schemas/TouchpointParticipant'
        responsibleManager: {type: [string, 'null']}
        author: {type: [string, 'null']}
    TouchpointChange:
      type: object
      required: [id, type, occurredAt, team, subject, responsibleManager, participantIds]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MEETING, CALL, EMAIL, NOTE, PROPOSAL]}
        occurredAt: {type: string, format: date-time, description: Дата не может быть в будущем}
        team: {type: string, minLength: 1, maxLength: 160}
        subject: {type: string, minLength: 1, maxLength: 300}
        responsibleManager: {type: string, minLength: 1, maxLength: 160}
        outcome: {type: [string, 'null'], maxLength: 2000}
        nextStep: {type: [string, 'null'], maxLength: 2000}
        participantIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
    TouchpointParticipant:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Coverage:
      type: object
      required: [initiativeId, asOf, days, verificationDays, contacts, departments]
      properties:
        initiativeId: {type: string, format: uuid}
        asOf: {type: string, format: date-time}
        days: {type: integer, minimum: 1, maximum: 365}
        verificationDays: {type: integer, minimum: 1}
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactCoverage'
        departments:
          type: array
          description: Подразделения с указанным отделом хотя бы у одного участника.
          items:
            $ref: '#/components/schemas/DepartmentCoverage'
    Recency:
      type: string
      enum: [RECENT, STALE, UNKNOWN]
      description: STALE означает достижение порога давности, UNKNOWN означает отсутствие записи к дате среза.
    ContactCoverage:
      type: object
      required: [id, name, jobTitle, department, decisionMaker, lastTouchAt, touchStatus, lastVerifiedAt, verificationStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        jobTitle: {type: [string, 'null']}
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
        decisionMaker: {type: boolean}
        lastTouchAt: {type: [string, 'null'], format: date-time}
        touchStatus:
          $ref: '#/components/schemas/Recency'
        lastVerifiedAt: {type: [string, 'null'], format: date-time}
        verificationStatus:
          $ref: '#/components/schemas/Recency'
    DepartmentCoverage:
      type: object
      required: [id, name, participantCount, recentCount, lastTouchAt, touchStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        participantCount: {type: integer, minimum: 1}
        recentCount: {type: integer, minimum: 0}
        lastTouchAt: {type: [string, 'null'], format: date-time}
        touchStatus:
          $ref: '#/components/schemas/Recency'
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
