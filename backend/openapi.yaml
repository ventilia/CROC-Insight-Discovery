        '201':
          description: Успешный результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportCounts'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Требуются права редактора и CSRF}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Запись изменилась или уже существует}
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CompanyContactId:
      name: contactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    KitDays:
      name: days
      in: query
      schema: {type: integer, minimum: 1, maximum: 365, default: 30}
    ContactSearch:
      name: q
      in: query
      schema: {type: string, maxLength: 120}
    ContactDepartment:
      name: departmentId
      in: query
      schema: {type: string, format: uuid}
    ContactJobTitle:
      name: jobTitle
      in: query
      schema: {type: string, maxLength: 160}
    ContactRole:
      name: roleCode
      in: query
      schema: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,31}$'}
    ContactInfluence:
      name: influence
      in: query
      schema: {type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN]}
    ContactDecisionMaker:
      name: decisionMaker
      in: query
      description: 'При true контакт принимает решения хотя бы в одной инициативе компании. При false таких инициатив у контакта нет.'
      schema: {type: boolean}
    ContactInteraction:
      name: interaction
      in: query
      schema: {type: string, enum: [RECENT, STALE, UNKNOWN]}
    ContactManager:
      name: responsibleManager
      in: query
      schema: {type: string, maxLength: 160}
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    demoBasic:
      type: http
      scheme: basic
      description: Локальный профиль demo. Для чтения используется demo-reader. Для изменения позиции требуется demo-editor.
  responses:
    BadRequest:
      description: Неверный идентификатор, параметр или тело запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуются действительные учётные данные демопрофиля
    NotFound:
      description: Запись отсутствует или текущему пользователю недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SavedWorkspaceItem:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    ProjectChange:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        stage: {type: [string, 'null'], maxLength: 100}
        owner: {type: [string, 'null'], maxLength: 200}
        due: {type: [string, 'null'], format: date}
        nextStep: {type: [string, 'null'], maxLength: 500}
    ContactImport:
      type: object
      required: [contacts]
      properties:
        contacts: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/ContactChange'}}
    ContactChange:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        jobTitle: {type: [string, 'null'], maxLength: 300}
        department: {type: [string, 'null'], maxLength: 160}
        email: {type: [string, 'null'], maxLength: 254}
        phone: {type: [string, 'null'], maxLength: 60}
    ParticipantChange:
      allOf:
        - $ref: '#/components/schemas/ContactChange'
        - type: object
          required: [decisionMaker]
          properties:
            decisionMaker: {type: boolean}
            roleLabel: {type: [string, 'null'], maxLength: 120}
            influence: {type: [string, 'null'], enum: [HIGH, MEDIUM, LOW, null]}
            influenceBasis: {type: [string, 'null'], maxLength: 500}
            mandate: {type: [string, 'null'], maxLength: 200}
            interest: {type: [string, 'null'], maxLength: 500}
            sourceLabel: {type: [string, 'null'], maxLength: 300}
            expectedVersion: {type: integer, minimum: 0, description: Обязательно при правке}
    RelationshipChange:
      type: object
      required: [source, target, type, label, confirmed]
      properties:
        source: {type: string, format: uuid}
        target: {type: string, format: uuid}
        type: {type: string, enum: [APPROVAL, COORDINATION, EXPERTISE]}
        label: {type: string, minLength: 1, maxLength: 300}
        confirmed: {type: boolean}
        sourceLabel: {type: [string, 'null'], maxLength: 500}
    InformationRequestChange:
      type: object
      required: [recipient, question]
      properties:
        personId: {type: [string, 'null'], format: uuid}
        recipient: {type: string, minLength: 1, maxLength: 200}
        question: {type: string, minLength: 1, maxLength: 1000}
    InformationRequestStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [DRAFT, DONE]}
    InformationRequest:
      allOf:
        - $ref: '#/components/schemas/InformationRequestChange'
        - $ref: '#/components/schemas/InformationRequestStatus'
        - type: object
          required: [id, createdAt]
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
    ImportCounts:
      type: object
      required: [created, attached, skipped]
      properties:
        created: {type: integer, minimum: 0}
        attached: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
    ModelSelection:
      type: object
      required: [provider, model]
      properties:
        provider: {type: string, enum: [OLLAMA, LM_STUDIO, SELF_HOSTED, OPENAI, OPENROUTER]}
        model: {type: string, minLength: 1, maxLength: 120}
        apiKey: {type: [string, 'null'], writeOnly: true, maxLength: 500}
        allowExternal: {type: boolean, default: false}
    ModelSettings:
      type: object
      required: [enabled, model, provider, canConfigure, hasApiKey, external, providers]
      properties:
        enabled: {type: boolean}
        model: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        canConfigure: {type: boolean}
        hasApiKey: {type: boolean}
        external: {type: boolean}
        providers:
          type: array
          items:
            type: object
            required: [id, label, port, external]
            properties:
              id: {type: string}
              label: {type: string}
              port: {type: [integer, 'null']}
              external: {type: boolean}
    TouchpointChange:
      type: object
      required: [id, type, occurredAt, team, subject, responsibleManager, participantIds]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MEETING, CALL, EMAIL, NOTE, PROPOSAL]}
        occurredAt: {type: string, format: date-time}
        team: {type: string, minLength: 1, maxLength: 160}
        subject: {type: string, minLength: 1, maxLength: 300}
        responsibleManager: {type: string, minLength: 1, maxLength: 160}
        participantIds: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
        outcome: {type: [string, 'null'], maxLength: 2000}
        nextStep: {type: [string, 'null'], maxLength: 2000}
        comment: {type: [string, 'null'], maxLength: 2000}
    Capabilities:
      type: object
      required: [mode, canCreateEvents]
      properties:
        mode: {type: string}
        canCreateEvents: {type: boolean}
        canManageWorkspace: {type: boolean}
        canImportContacts: {type: boolean}
    Dashboard:
      type: object
      required: [days, verificationDays, accessibleCompanyCount, registeredContactCount, activeInteractionCount, earliestAsOf, latestAsOf, riskCount, risks]
      properties:
        days: {type: integer, minimum: 1, maximum: 365}
        verificationDays: {type: integer, minimum: 0}
        accessibleCompanyCount: {type: integer, minimum: 0}
        registeredContactCount: {type: integer, minimum: 0}
        activeInteractionCount: {type: integer, minimum: 0}
        earliestAsOf: {type: [string, 'null'], format: date-time}
        latestAsOf: {type: [string, 'null'], format: date-time}
        riskCount: {type: integer, minimum: 0}
        risks: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/RiskFact'}}
        companies:
          type: array
          items:
            type: object
            required: [companyId, initiativeCount, contactCount, departmentCount, latestAsOf]
            properties:
              companyId: {type: string, format: uuid}
              initiativeCount: {type: integer, minimum: 0}
              contactCount: {type: integer, minimum: 0}
              departmentCount: {type: integer, minimum: 0}
              latestAsOf: {type: [string, 'null'], format: date-time}
        recentInteractions:
          type: array
          maxItems: 4
          items:
            type: object
            required: [id, initiativeId, initiativeName, type, occurredAt, subject, team]
            properties:
              id: {type: string, format: uuid}
              initiativeId: {type: string, format: uuid}
              initiativeName: {type: string}
              type: {type: string}
              occurredAt: {type: string, format: date-time}
              subject: {type: string}
              team: {type: string}
    CompanyInsights:
      type: object
      required: [companyId, companyName, days, verificationDays, registeredContactCount, activeInteractionCount, earliestAsOf, latestAsOf, initiatives, riskCount, risks]
      properties:
        companyId: {type: string, format: uuid}
        companyName: {type: string}
        days: {type: integer, minimum: 1, maximum: 365}
        verificationDays: {type: integer, minimum: 0}
        registeredContactCount: {type: integer, minimum: 0}
        activeInteractionCount: {type: integer, minimum: 0}
        earliestAsOf: {type: [string, 'null'], format: date-time}
        latestAsOf: {type: [string, 'null'], format: date-time}
        initiatives: {type: array, items: {$ref: '#/components/schemas/InitiativeInsights'}}
        riskCount: {type: integer, minimum: 0}
        risks: {type: array, items: {$ref: '#/components/schemas/RiskFact'}}
    InitiativeInsights:
      type: object
      required: [initiativeId, initiativeName, asOf, activeInteractionCount]
      properties:
        initiativeId: {type: string, format: uuid}
        initiativeName: {type: string}
        asOf: {type: string, format: date-time}
        activeInteractionCount: {type: integer, minimum: 0}
    RiskFact:
      type: object
      required: [code, evidenceStatus, companyId, companyName, initiativeId, initiativeName, asOf, subjectId, subjectName, lastObservedAt]
      properties:
        code: {type: string, enum: [UNCONTACTED_DEPARTMENT, UNCONTACTED_DECISION_MAKER, SINGLE_ENGAGED_DECISION_MAKER, STALE_CONTACT_VERIFICATION, UNKNOWN_CONTACT_VERIFICATION]}
        evidenceStatus: {type: string, enum: [NO_EVIDENCE, STALE, RECORDED]}
        companyId: {type: string, format: uuid}
        companyName: {type: string}
        initiativeId: {type: string, format: uuid}
        initiativeName: {type: string}
        asOf: {type: string, format: date-time}
        subjectId: {type: string, format: uuid}
        subjectName: {type: string}
        lastObservedAt: {type: [string, 'null'], format: date-time}
    CompanyProfile:
      type: object
      required: [id, name, industry, description, departments, initiatives, contactCount, keyContacts]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        industry: {type: [string, 'null']}
        description: {type: [string, 'null']}
        departments: {type: array, items: {$ref: '#/components/schemas/Department'}}
        initiatives: {type: array, items: {$ref: '#/components/schemas/Initiative'}}
        contactCount: {type: integer, minimum: 0}
        keyContacts: {type: array, items: {$ref: '#/components/schemas/CompanyContact'}}
    CompanyContactPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CompanyContact'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
    CompanyContact:
      type: object
      required: [id, name, jobTitle, department, roles, influence, decisionMaker, lastInteractionAt, interaction, responsibleManager]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        jobTitle: {type: [string, 'null']}
        department: {anyOf: [{$ref: '#/components/schemas/Department'}, {type: 'null'}]}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        influence: {type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN]}
        decisionMaker: {type: boolean}
        lastInteractionAt: {type: [string, 'null'], format: date-time}
        interaction: {$ref: '#/components/schemas/Recency'}
        responsibleManager: {type: [string, 'null']}
    CompanyContactProfile:
      allOf:
        - $ref: '#/components/schemas/CompanyContact'
        - type: object
          required: [companyId, email, phone, assignments, connections]
          properties:
            companyId: {type: string, format: uuid}
            email: {type: [string, 'null']}
            phone: {type: [string, 'null']}
            assignments: {type: array, items: {$ref: '#/components/schemas/ContactAssignment'}}
            connections: {type: array, items: {$ref: '#/components/schemas/ContactConnection'}}
    ContactAssignment:
      type: object
      required: [initiativeId, initiativeName, asOf, role, decisionMaker, influence, influenceBasis]
      properties:
        initiativeId: {type: string, format: uuid}
        initiativeName: {type: string}
        asOf: {type: string, format: date-time}
        role: {anyOf: [{$ref: '#/components/schemas/Role'}, {type: 'null'}]}
        decisionMaker: {type: boolean}
        influence: {type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN]}
        influenceBasis: {type: [string, 'null']}
    ContactConnection:
      type: object
      required: [id, contactId, name, initiativeId, initiativeName, direction, type, label, confirmed]
      properties:
        id: {type: string, format: uuid}
        contactId: {type: string, format: uuid}
        name: {type: string}
        initiativeId: {type: string, format: uuid}
        initiativeName: {type: string}
        direction: {type: string, enum: [INCOMING, OUTGOING]}
        type: {type: string}
        label: {type: string}
        confirmed: {type: boolean}
    CompanyGraph:
      type: object
      required: [companyId, nodes, edges, filters, matchingPeople]
      properties:
        companyId: {type: string, format: uuid}
        nodes: {type: array, items: {$ref: '#/components/schemas/CompanyContact'}}
        edges: {type: array, items: {$ref: '#/components/schemas/CompanyEdge'}}
        filters: {$ref: '#/components/schemas/Filters'}
        matchingPeople: {type: integer, minimum: 0}
    CompanyEdge:
      type: object
      required: [id, initiativeId, initiativeName, source, target, type, label, confirmed]
      properties:
        id: {type: string, format: uuid}
        initiativeId: {type: string, format: uuid}
        initiativeName: {type: string}
        source: {type: string, format: uuid}
        target: {type: string, format: uuid}
        type: {type: string}
        label: {type: string}
        confirmed: {type: boolean}
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        industry: {type: [string, 'null']}
        description: {type: [string, 'null']}
    Initiative:
      type: object
      required: [id, companyId, name, asOf]
      properties:
        stage: {type: [string, 'null']}
        owner: {type: [string, 'null']}
        due: {type: [string, 'null'], format: date}
        nextStep: {type: [string, 'null']}
        participantCount: {type: integer, minimum: 0}
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
        asOf:
          type: string
          format: date-time
    Graph:
      type: object
      required: [companyId, initiativeId, asOf, nodes, edges, filters, matchingPeople]
      properties:
        companyId:
          type: string
          format: uuid
        initiativeId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
          description: Дата среза данных инициативы.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          description: Направленные связи, оба участника которых входят в видимую выборку.
          items:
            $ref: '#/components/schemas/Edge'
        filters:
          $ref: '#/components/schemas/Filters'
        matchingPeople:
          type: integer
          minimum: 0
          description: Число участников после применения фильтров.
    Node:
      type: object
      required: [id, name, jobTitle, department, role, decisionMaker]
      properties:
        influence: {type: [string, 'null'], enum: [HIGH, MEDIUM, LOW, null]}
        influenceBasis: {type: [string, 'null']}
        email: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        id:
          type: string
          format: uuid
          description: ID контакта сохраняется при смене инициативы.
        name:
          type: string
        jobTitle:
          type: [string, 'null']
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
        role:
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        decisionMaker:
          type: boolean
          description: Признак ЛПР в текущей инициативе. ЛПР может быть несколько.
    Edge:
      type: object
      required: [id, source, target, type, label, confirmed]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        type:
          type: string
          description: Код типа связи. В демонаборе используются APPROVAL, EXPERTISE и COORDINATION.
        label:
          type: string
        confirmed:
          type: boolean
    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Role:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,31}$'
        label:
          type: string
    Filters:
      type: object
      description: Варианты фильтров для всей доступной инициативы.
      required: [departments, roles]
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PersonDossier:
      type: object
      required: [companyId, initiativeId, asOf, person, position]
      properties:
        companyId:
          type: string
          format: uuid
        initiativeId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        person:
          $ref: '#/components/schemas/Node'
        position:
          oneOf:
            - $ref: '#/components/schemas/PositionRevision'
            - type: 'null'
    Stance:
      type: string
      enum: [SUPPORTS, NEUTRAL, DOUBTS, OPPOSES]
    PositionRevision:
      type: object
      required: [version, stance, basis, author, changedAt]
      properties:
        version: {type: integer, minimum: 1}
        stance:
          $ref: '#/components/schemas/Stance'
        basis: {type: string}
        author: {type: string}
        changedAt: {type: string, format: date-time}
    PositionSource:
      type: object
      required: [version, position, canEdit]
      properties:
        version:
          type: integer
          minimum: 0
          description: Ноль означает, что в источнике пока нет позиции.
        position:
          oneOf:
            - $ref: '#/components/schemas/PositionRevision'
            - type: 'null'
        canEdit: {type: boolean}
    TouchpointPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Touchpoint'
        nextCursor:
          type: [string, 'null']
          format: uuid
          description: Значение для следующего запроса или null в конце истории.
    Touchpoint:
      type: object
      required: [id, type, occurredAt, team, subject, outcome, nextStep, sourceLabel, participants]
      properties:
        responsibleManager: {type: [string, 'null']}
        author: {type: [string, 'null']}
        comment: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        initiativeId: {type: [string, 'null'], format: uuid}
        initiativeName: {type: [string, 'null']}
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Код вида касания. В демонаборе используются MEETING, EMAIL и CALL.
        occurredAt:
          type: string
          format: date-time
        team:
          type: string
        subject:
          type: string
        outcome:
          type: [string, 'null']
        nextStep:
          type: [string, 'null']
        sourceLabel:
          type: [string, 'null']
        participants:
          type: array
          items:
            $ref: '#/components/schemas/TouchpointParticipant'
    TouchpointParticipant:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Coverage:
      type: object
      required: [initiativeId, asOf, days, verificationDays, contacts, departments]
      properties:
        initiativeId: {type: string, format: uuid}
        asOf: {type: string, format: date-time}
        days: {type: integer, minimum: 1, maximum: 365}
        verificationDays: {type: integer, minimum: 1}
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactCoverage'
        departments:
          type: array
          description: Подразделения с указанным отделом хотя бы у одного участника.
          items:
            $ref: '#/components/schemas/DepartmentCoverage'
    RelationshipHealth:
      type: object
      required: [initiativeId, asOf, days, verificationDays, status, score, decisionMakerTouches, departmentTouches,
                 decisionMakerVerification, contactsWithoutTouchpoints, contactsWithoutDepartment]
      properties:
        initiativeId: {type: string, format: uuid}
        asOf: {type: string, format: date-time}
        days: {type: integer, minimum: 1, maximum: 365}
        verificationDays: {type: integer, minimum: 1}
        status:
          type: string
          enum: [READY, PARTIAL, INSUFFICIENT_DATA]
          description: Для расчёта нужна хотя бы одна известная давность по каждому показателю.
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Сумма взвешенных долей recent от total. При INSUFFICIENT_DATA приходит null.
        decisionMakerTouches:
          $ref: '#/components/schemas/HealthFactor'
        departmentTouches:
          $ref: '#/components/schemas/HealthFactor'
        decisionMakerVerification:
          $ref: '#/components/schemas/HealthFactor'
        contactsWithoutTouchpoints: {type: integer, minimum: 0}
        contactsWithoutDepartment: {type: integer, minimum: 0}
    HealthFactor:
      type: object
      required: [total, recent, unknown, weight]
      properties:
        total: {type: integer, minimum: 0}
        recent: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
        weight: {type: integer, minimum: 0, maximum: 100}
    Recency:
      type: string
      enum: [RECENT, STALE, UNKNOWN]
      description: STALE означает достижение порога давности, UNKNOWN означает отсутствие записи к дате среза.
    ContactCoverage:
      type: object
      required: [id, name, jobTitle, department, decisionMaker, lastTouchAt, touchStatus, lastVerifiedAt, verificationStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        jobTitle: {type: [string, 'null']}
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
        decisionMaker: {type: boolean}
        lastTouchAt: {type: [string, 'null'], format: date-time}
        touchStatus:
          $ref: '#/components/schemas/Recency'
        lastVerifiedAt: {type: [string, 'null'], format: date-time}
        verificationStatus:
          $ref: '#/components/schemas/Recency'
    DepartmentCoverage:
      type: object
      required: [id, name, participantCount, recentCount, lastTouchAt, touchStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        participantCount: {type: integer, minimum: 1}
        recentCount: {type: integer, minimum: 0}
        lastTouchAt: {type: [string, 'null'], format: date-time}
        touchStatus:
          $ref: '#/components/schemas/Recency'
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
