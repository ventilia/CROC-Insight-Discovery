name: backend ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: croc_insight
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d croc_insight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: configure demo database
        shell: bash
        run: |
          cat > .env <<'EOF'
          CROC_DB_ADMIN_PASSWORD=postgres
          CROC_DB_MIGRATOR_PASSWORD=postgres
          CROC_DB_READER_PASSWORD=postgres
          CROC_DEMO_API_PASSWORD=ci-demo-reader
          CROC_DB_WRITER_PASSWORD=postgres
          EOF

      - name: test backend
        run: ./gradlew test --no-daemon

  gemini:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: check gemini with a synthetic question
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os

          key = os.environ["GEMINI_API_KEY"]
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing")
          payload = {
              "model": os.environ["GEMINI_MODEL"],
              "messages": [{"role": "user", "content": "Reply with OK only."}],
              "max_tokens": 128,
          }
          conn = http.client.HTTPSConnection("generativelanguage.googleapis.com", timeout=20)
          conn.request(
              "POST",
              "/v1beta/openai/chat/completions",
              body=json.dumps(payload),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
          )
          try:
              response = conn.getresponse()
              if response.status != 200:
                  raise SystemExit(f"Gemini rejected the probe: HTTP {response.status}")
              result = json.load(response)
          finally:
              conn.close()
          choices = result.get("choices") or [{}]
          if not choices[0].get("message", {}).get("content"):
              raise SystemExit("Gemini returned no text")
          print("Gemini returned a response")
          PY
